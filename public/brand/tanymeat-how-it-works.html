<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TanyMeat Online Story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { color-scheme: light; --ground: #FFE2E2; --ink: #18191c; --muted: #77787f; --line: #e6e6ea; --accent: #82181A; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { color-scheme: dark; --ground: #0c0d0e; --ink: #e4e7ec; --muted: #8a8c95; --line: #26272b; --accent: #FFA2A2; }
  }
  :root[data-theme="dark"] { color-scheme: dark; --ground: #0c0d0e; --ink: #e4e7ec; --muted: #8a8c95; --line: #26272b; --accent: #FFA2A2; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    background: var(--ground); color: var(--ink); font-family: "Space Grotesk", ui-sans-serif, system-ui, sans-serif; }
  main { width: 100%; max-width: 620px; }
  /* Narrow frames (phones): start at the top instead of centring in the frame. */
  @media (max-width: 480px) { body { place-items: start center; padding: 0 8px; } #stage .cap { top: 16px; } #stage canvas { transform: translateY(28px); } }
  #stage { position: relative; width: 100%; aspect-ratio: 1 / 1; }
  #stage canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; display: block; }
  .cap { position: absolute; left: 4px; top: 6px; right: 4px; z-index: 2; pointer-events: none; text-align: center; }
  .cap .line { margin: 6px auto 0; font-size: clamp(16px, 2.4vw, 22px); font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; max-width: 15em; }
  .cap > div { transition: none; }
  #fade { position: absolute; inset: 0; background: var(--ground); opacity: 0; pointer-events: none; z-index: 3; }
</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
</head>
<body>
<main>
  <div id="stage" role="img" aria-label="A 3D TanyMeat fresh-meat shop builds itself, launches its own ordering app, customers pick the cut and quantity, orders are cut fresh and delivered cold to their doors, and the shop keeps every rupee with zero marketplace commission.">
    <div class="cap"><div class="step" id="capStep"></div><div class="line" id="capLine"></div></div>
    <div id="fade"></div>
  </div>
</main>
<script type="module">
import * as THREE from "three";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const root = document.documentElement, q = new URLSearchParams(location.search);
if (q.get("video")) root.classList.add("video");
if (["light", "dark"].includes(q.get("theme"))) root.dataset.theme = q.get("theme");
const stage = document.getElementById("stage");

// ---------- renderer, camera, light ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.max(2, Math.min(devicePixelRatio, 3)));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;

const CX = 6.5, CZ = 5.5, VIEW = 9.6;
const cam = new THREE.OrthographicCamera(-VIEW, VIEW, VIEW, -VIEW, 0.1, 200);
cam.position.set(CX + 30, 26.8, CZ + 30);
cam.lookAt(CX, 2.8, CZ);

scene.add(new THREE.HemisphereLight(0xffffff, 0xe9dccb, 0.8));
const sun = new THREE.DirectionalLight(0xfff3e4, 2.1);
sun.position.set(CX - 6, 18, CZ + 12);
sun.target.position.set(CX, 0, CZ);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
sun.position.set(6, 22, 22); sun.target.position.set(12, 0, 10);
sun.shadow.camera.left = -24; sun.shadow.camera.right = 24; sun.shadow.camera.top = 24; sun.shadow.camera.bottom = -24; sun.shadow.camera.far = 80;
sun.shadow.radius = 4; sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.02;
scene.add(sun, sun.target);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.ShadowMaterial({ opacity: 0.12, color: 0x3a2a55 }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -0.52; ground.receiveShadow = true;
scene.add(ground);

// ---------- materials ----------
const M = (color, rough = 0.7, metal = 0) => new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: metal });
const plankTex = (() => {
  const c = document.createElement("canvas"); c.width = 1024; c.height = 1024; const g = c.getContext("2d");
  const rows = 14, h = 1024 / rows;
  for (let r = 0; r < rows; r++) {
    let x = -((r * 337) % 400);
    while (x < 1024) {
      const w = 300 + ((r * 97 + x * 13) % 260), l = 76 + ((r * 31 + Math.abs(x) * 7) % 9);
      g.fillStyle = `hsl(32, 52%, ${l}%)`; g.fillRect(x, r * h, w, h);
      g.fillStyle = "rgba(120,80,40,.10)"; for (let k = 0; k < 5; k++) g.fillRect(x, r * h + 6 + k * (h / 5), w, 1);
      g.fillStyle = "rgba(110,70,35,.35)"; g.fillRect(x, r * h, 2, h);
      x += w;
    }
    g.fillStyle = "rgba(110,70,35,.35)"; g.fillRect(0, r * h, 1024, 2);
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
})();
const mat = {
  floor: new THREE.MeshStandardMaterial({ map: plankTex, roughness: 0.55 }),
  floorEdge: M(0xd9b48a, 0.6),
  wall: M(0xf6f2ec, 0.9),
  frame: M(0xffffff, 0.5), glass: M(0xcfe4ec, 0.15, 0.1),
  green: M(0x5e0f11, 0.5), mint: M(0xffa2a2, 0.5), cream: M(0xfff6e6, 0.7),
  marble: M(0xf7f5f1, 0.25), wood: M(0xc68c55, 0.6), woodDark: M(0x9a6438, 0.6),
  steel: M(0xe6e8ea, 0.35, 0.4), ink: M(0x24282c, 0.5), cushion: M(0x8e4a92, 0.8), kraft: M(0xc99a62, 0.85), tape: M(0xf4a8ff, 0.6), toolRed: M(0xd64933, 0.45), peg: M(0xd9c3a5, 0.8),
  amber: M(0xe3a14f, 0.5), terra: M(0xc8643b, 0.7), leaf: new THREE.MeshStandardMaterial({ color: 0x4f9a5d, roughness: 0.8, flatShading: true }),
  food: M(0xf0913a, 0.6), menuLine: M(0xffa2a2, 0.6), tileW: M(0xf4f6f7, 0.35), chill: new THREE.MeshStandardMaterial({ color: 0xdff3fb, roughness: 0.05, metalness: 0.1, transparent: true, opacity: 0.32 }), tray: M(0xffffff, 0.35), chicken: M(0xf0c39a, 0.55), mutton: M(0xb8434d, 0.55), fish: M(0x9fb3c2, 0.35, 0.2), ice: M(0xe8f6fb, 0.2),
};

// ---------- the TanyMeat sign (drawn once the brand font is in) ----------
const sign = (() => {
  const c = document.createElement("canvas"); c.width = 2400; c.height = 400;
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  let done = false;
  const draw = () => {
    if (done || typeof drawLogo !== "function") return;
    const g = c.getContext("2d");
    g.setTransform(2, 0, 0, 2, 0, 0);
    g.fillStyle = "#ffffff"; g.fillRect(0, 0, 1200, 200);
    const wh = 100, ww = wh * 222 / 41, total = 150 + 34 + ww, x0 = (1200 - total) / 2;
    drawLogo(g, x0, 25, 150);
    if (imgsReady) for (let a = 0; a < 12; a++) g.drawImage(imgWord, x0 + 184 + 2.6 * Math.cos(a * Math.PI / 6), 52 + 2.6 * Math.sin(a * Math.PI / 6), ww, wh);
    tex.needsUpdate = true; done = imgsReady;
  };
  return { tex, draw, reset: () => { done = false; } };
})();

// ---------- helpers (world: x, y on the floor, z up → three: x, z, y) ----------
const mesh = (geo, m, x, y, z) => { const o = new THREE.Mesh(geo, m); o.position.set(x, z, y); o.castShadow = true; o.receiveShadow = true; return o; };
const rbox = (x0, y0, x1, y1, z0, z1, m, r = 0.08) => mesh(new RoundedBoxGeometry(x1 - x0, z1 - z0, y1 - y0, 3, Math.min(r, (Math.min(x1 - x0, y1 - y0, z1 - z0)) / 2 - 0.001)), m, (x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
const cyl = (cx, cy, r, z0, z1, m, rTop = r) => mesh(new THREE.CylinderGeometry(rTop, r, z1 - z0, 40), m, cx, cy, (z0 + z1) / 2);

const parts = [];
const part = (t0, kind, build, pivot = [0, 0, 0]) => {
  const g = new THREE.Group(); g.position.set(pivot[0], pivot[2], pivot[1]);
  const inner = new THREE.Group(); inner.position.set(-pivot[0], -pivot[2], -pivot[1]);
  g.add(inner); build(inner); scene.add(g);
  parts.push({ t0, kind, g });
};

// 1 · floor slab
part(0, "floor", (g) => {
  const slab = rbox(0, 0, 13, 11, -0.5, 0, mat.floorEdge, 0.12);
  slab.material = [mat.floorEdge, mat.floorEdge, mat.floor, mat.floorEdge, mat.floorEdge, mat.floorEdge];
  g.add(slab);
}, [6.5, 5.5, 0]);

// 2 · walls with their windows, menu board and door
part(0.45, "wall", (g) => {
  g.add(rbox(0, 0.4, 0.4, 11, 0, 6.2, mat.wall, 0.06));
  g.add(rbox(0.38, 0.9, 0.48, 7.6, 0.2, 3.2, mat.tileW, 0.04));                                   // white tile splash
  for (let y = 1.6; y < 7.6; y += 0.7) g.add(rbox(0.47, y - 0.01, 0.49, y + 0.01, 0.2, 3.2, M(0xd5dade, 0.5), 0.004));
  for (let z = 0.9; z < 3.2; z += 0.7) g.add(rbox(0.47, 0.9, 0.49, 7.6, z - 0.01, z + 0.01, M(0xd5dade, 0.5), 0.004));
  g.add(rbox(0.38, 8.2, 0.55, 10.6, 0, 4.0, M(0xc9ced4, 0.3, 0.7), 0.06));                        // cold-room door
  g.add(rbox(0.54, 8.35, 0.6, 10.45, 0.15, 3.85, M(0xdde2e6, 0.3, 0.6), 0.04));
  g.add(rbox(0.6, 10.0, 0.75, 10.15, 1.6, 2.6, mat.ink, 0.04));
  g.add(rbox(0.55, 8.9, 0.6, 9.7, 3.2, 3.6, M(0x3d8fd1, 0.4), 0.03));                                // a blue "cold" panel
}, [0.2, 5.7, 0]);
part(0.6, "wall", (g) => {
  g.add(rbox(0, 0, 13, 0.4, 0, 6.2, mat.wall, 0.06));
  g.add(rbox(1.2, 0.38, 4.0, 0.5, 2.6, 4.6, mat.green, 0.06));
  g.add(rbox(1.55, 0.48, 2.45, 0.54, 3.0, 3.8, mat.menuLine, 0.1));                    // a "fresh today" board
  g.add(rbox(2.75, 0.48, 3.65, 0.54, 3.0, 3.8, mat.menuLine, 0.1));
  g.add(rbox(1.55, 0.48, 3.65, 0.54, 4.05, 4.2, mat.menuLine, 0.03));
  g.add(rbox(11.6, 0.38, 12.8, 0.52, 0, 4.1, mat.woodDark, 0.05));
  g.add(cyl(11.85, 0.6, 0.07, 2.0, 2.1, mat.steel));
  // the TanyMeat sign above the awning
  g.add(rbox(4.9, 0.38, 11.3, 0.5, 4.98, 6.12, mat.frame, 0.08));
  const sp = new THREE.Mesh(new THREE.PlaneGeometry(6.2, 1.03), new THREE.MeshStandardMaterial({ map: sign.tex, roughness: 0.6 }));
  sp.position.set(8.1, 5.53, 0.505); g.add(sp);
}, [6.5, 0.2, 0]);

// 3 · the seafood freezer: a chilled glass display on the left, fish and prawns on ice
const CUTS = [{ y: 3.9 }, { y: 5.8 }, { y: 7.7 }];
part(1.2, "drop", (g) => {
  g.add(rbox(2.4, 2.9, 4.4, 8.7, 0, 1.15, mat.frame, 0.08));                                       // body
  g.add(rbox(2.38, 2.88, 4.42, 8.72, 0.15, 0.3, mat.green, 0.04));                                  // brand kick plate
  g.add(rbox(2.5, 3.0, 4.3, 8.6, 1.15, 1.22, mat.ice, 0.03));                                       // ice bed
  g.add(rbox(2.4, 2.9, 2.6, 8.7, 1.15, 2.05, mat.frame, 0.05));                                     // back rail
});
part(1.38, "drop", (g) => {
  CUTS.forEach((c) => g.add(rbox(2.75, c.y - 0.75, 4.05, c.y + 0.75, 1.22, 1.3, mat.tray, 0.04)));
  // whole fish, lying across the first tray
  for (let k = 0; k < 3; k++) {
    const f = mesh(new THREE.SphereGeometry(0.22, 18, 12), mat.fish, 3.4, 3.4 + k * 0.45, 1.4); f.scale.set(2.4, 0.55, 0.75); g.add(f);
    const tail = mesh(new THREE.ConeGeometry(0.14, 0.3, 3), mat.fish, 2.78, 3.4 + k * 0.45, 1.42); tail.rotation.z = -Math.PI / 2; g.add(tail);
  }
  // prawns on the second tray
  const prawn = M(0xf08a5d, 0.5);
  for (let k = 0; k < 3; k++) for (let j = 0; j < 3; j++) {
    const pr = mesh(new THREE.TorusGeometry(0.13, 0.055, 8, 16, Math.PI * 1.3), prawn, 3.0 + j * 0.42, 5.35 + k * 0.42, 1.36); pr.rotation.x = -Math.PI / 2; g.add(pr);
  }
  // fish slices on the third tray
  for (let k = 0; k < 3; k++) for (let j = 0; j < 2; j++) g.add(cyl(3.1 + j * 0.6, 7.25 + k * 0.45, 0.2, 1.3, 1.42, M(0xf3d9cf, 0.45)));
});
part(1.5, "drop", (g) => {                                                                           // slanted glass front + top
  const front = new THREE.Mesh(new THREE.PlaneGeometry(5.8, 1.0), mat.chill); front.rotation.y = Math.PI / 2; front.rotation.x = -0.5; front.position.set(4.25, 1.62, 5.8); g.add(front);
  const top = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 5.8), mat.chill); top.rotation.x = -Math.PI / 2; top.position.set(3.25, 2.05, 5.8); g.add(top);
});

// 4 · the billing counter under the awning: a cutting block, a cleaver and a scale
part(1.55, "drop", (g) => {
  g.add(rbox(5.0, 0.4, 11.2, 1.9, 0, 2.05, mat.green, 0.08));
  g.add(rbox(4.9, 0.4, 11.3, 2.05, 2.05, 2.2, mat.marble, 0.05));
  for (let x = 5.6; x < 11; x += 0.9) g.add(rbox(x, 1.9, x + 0.08, 1.95, 0.25, 1.85, mat.mint, 0.02));
});
part(1.7, "drop", (g) => {
  g.add(cyl(6.3, 1.25, 0.6, 2.2, 2.65, mat.wood)); g.add(cyl(6.3, 1.25, 0.61, 2.62, 2.66, M(0xd9b48a, 0.6)));       // cutting block
  g.add(rbox(6.2, 1.05, 6.75, 1.45, 2.66, 2.7, mat.steel, 0.02)); g.add(rbox(6.75, 1.18, 7.2, 1.32, 2.66, 2.72, mat.ink, 0.03));   // cleaver
  g.add(rbox(8.0, 0.8, 8.9, 1.6, 2.2, 2.35, mat.steel, 0.05)); g.add(rbox(8.05, 0.85, 8.85, 1.55, 2.35, 2.4, mat.frame, 0.03));    // scale
  g.add(rbox(8.2, 0.7, 8.7, 0.8, 2.25, 2.33, M(0x4cc285, 0.4), 0.01));
  g.add(rbox(9.3, 0.9, 10.5, 1.6, 2.2, 2.26, mat.ink, 0.03));
  const scr = rbox(9.3, 0.82, 10.5, 0.9, 2.26, 3.0, mat.ink, 0.03); scr.rotation.x = -0.18; g.add(scr);
});

// 5 · two cutting stations on the floor: live chicken (with its cage) and fresh mutton
const STATIONS = [{ x: 9.6, y: 6.7, label: "Live Chicken ₹240/kg", z: 2.7 }, { x: 6.4, y: 6.7, label: "Fresh Mutton ₹780/kg", z: 2.7 }];
part(1.85, "drop", (g) => {                                                                          // chicken: a wooden chopping stump
  g.add(cyl(9.6, 6.7, 0.62, 0, 1.15, mat.wood)); g.add(cyl(9.6, 6.7, 0.63, 1.12, 1.17, M(0xd9b48a, 0.6)));
  for (let k = 0; k < 3; k++) g.add(cyl(9.6, 6.7, 0.635, 0.25 + k * 0.32, 0.27 + k * 0.32, mat.woodDark));
  g.add(rbox(9.45, 6.45, 9.95, 6.8, 1.17, 1.2, mat.steel, 0.02)); g.add(rbox(9.95, 6.56, 10.35, 6.7, 1.17, 1.24, mat.ink, 0.03));   // cleaver
  for (const [dx, dy] of [[-0.2, 0.25], [0.05, 0.35]]) { const pc = mesh(new THREE.SphereGeometry(0.13, 12, 8), mat.chicken, 9.6 + dx, 6.7 + dy, 1.22); pc.scale.set(1.3, 0.55, 1); g.add(pc); }
});
part(1.95, "drop", (g) => {                                                                          // the live-chicken cage beside it
  const cx0 = 10.7, cx1 = 12.3, cy0 = 5.6, cy1 = 7.8, h = 1.4;
  g.add(rbox(cx0, cy0, cx1, cy1, 0, 0.12, mat.woodDark, 0.03));
  for (const [x, y] of [[cx0, cy0], [cx1, cy0], [cx0, cy1], [cx1, cy1]]) g.add(rbox(x - 0.05, y - 0.05, x + 0.05, y + 0.05, 0, h, mat.steel, 0.02));
  g.add(rbox(cx0, cy0, cx1, cy1, h, h + 0.06, mat.steel, 0.02));
  for (let x = cx0 + 0.27; x < cx1; x += 0.27) for (const y of [cy0, cy1]) g.add(rbox(x - 0.015, y - 0.015, x + 0.015, y + 0.015, 0.12, h, mat.steel, 0.005));
  for (let y = cy0 + 0.27; y < cy1; y += 0.27) for (const x of [cx0, cx1]) g.add(rbox(x - 0.015, y - 0.015, x + 0.015, y + 0.015, 0.12, h, mat.steel, 0.005));
  const white = M(0xf7f5ef, 0.7), comb = M(0xd23b2a, 0.5), beak = M(0xf2a33a, 0.5);
  for (const [x, y, r] of [[11.2, 6.2, 0.3], [11.8, 6.9, -0.5], [11.1, 7.3, 1.2]]) {
    const hen = new THREE.Group(); hen.position.set(x, 0.12, y); hen.rotation.y = r;
    const body = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 12), white); body.scale.set(1.25, 0.95, 0.9); body.position.y = 0.32; body.castShadow = true; hen.add(body);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.15, 14, 10), white); head.position.set(0.32, 0.62, 0); hen.add(head);
    const cm = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.09, 0.04), comb); cm.position.set(0.32, 0.79, 0); hen.add(cm);
    const bk = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.12, 8), beak); bk.rotation.z = -Math.PI / 2; bk.position.set(0.5, 0.6, 0); hen.add(bk);
    const tl = new THREE.Mesh(new THREE.SphereGeometry(0.14, 10, 8), white); tl.position.set(-0.36, 0.48, 0); tl.scale.set(0.8, 1.3, 0.6); hen.add(tl);
    g.add(hen);
  }
});
part(2.05, "drop", (g) => {                                                                          // mutton: a butcher's table with a thick block
  for (const [x, y] of [[5.6, 6.0], [7.2, 6.0], [5.6, 7.4], [7.2, 7.4]]) g.add(rbox(x - 0.06, y - 0.06, x + 0.06, y + 0.06, 0, 0.85, mat.steel, 0.02));
  g.add(rbox(5.45, 5.85, 7.35, 7.55, 0.85, 0.95, mat.steel, 0.03));
  g.add(rbox(5.6, 6.0, 7.2, 7.4, 0.95, 1.3, mat.wood, 0.06));
  for (const [dx, dy] of [[-0.35, -0.2], [0.05, 0.25], [0.4, -0.15]]) { const pc = mesh(new THREE.SphereGeometry(0.17, 14, 10), mat.mutton, 6.4 + dx, 6.7 + dy, 1.38); pc.scale.set(1.3, 0.6, 1); g.add(pc); }
  g.add(rbox(6.75, 6.35, 7.15, 6.8, 1.3, 1.33, mat.steel, 0.02)); g.add(rbox(6.85, 6.8, 7.0, 7.15, 1.3, 1.37, mat.ink, 0.03));  // cleaver
});

// 7 · plant in the front corner
part(2.45, "drop", (g) => {
  g.add(cyl(2.0, 10.3, 0.38, 0, 0.8, mat.terra, 0.48));
  const a = mesh(new THREE.IcosahedronGeometry(0.75, 1), mat.leaf, 2.0, 10.3, 1.55); g.add(a);
  const b = mesh(new THREE.IcosahedronGeometry(0.5, 1), mat.leaf, 1.8, 10.5, 2.2); g.add(b);
});

// 8 · the striped awning unfolds over the counter (pivot at the hinge on the wall)
const awning = (() => {
  const g = new THREE.Group(); g.position.set(0, 4.85, 0.42);
  const panel = new THREE.Group(); g.add(panel);
  const x0 = 4.6, x1 = 11.6, n = 8, w = (x1 - x0) / n, L = 2.1;
  for (let i = 0; i < n; i++) {
    const m = i % 2 ? mat.cream : mat.green;
    const s = new THREE.Mesh(new THREE.BoxGeometry(w, 0.07, L), m); s.position.set(x0 + w * (i + 0.5), 0, L / 2); s.castShadow = true; panel.add(s);
  }
  const val = new THREE.Group(); val.position.set(0, 0, L); panel.add(val);
  for (let i = 0; i < n; i++) {

  g.beginPath(); g.moveTo(66, 112); g.lineTo(190, 112); g.moveTo(98, 62); g.lineTo(98, 90); g.moveTo(158, 62); g.lineTo(158, 90); g.stroke();
  g.beginPath(); g.moveTo(102, 150); g.lineTo(120, 168); g.lineTo(156, 134); g.stroke();
  g.beginPath(); g.arc(200, 56, 34, 0, Math.PI * 2); g.fillStyle = "#FFA2A2"; g.fill();
  g.fillStyle = "#82181A"; g.font = `700 40px ${FONT}`; g.textAlign = "center"; g.fillText("+1", 200, 70);
};
const ORDERS = [0, 2, 1, 2, 0].map((h, i) => ({ h, t0: 6.5 + i * 0.42, dur: 0.95, s: iconSprite(bagIcon, 1.7) }));
const coinMat = new THREE.MeshStandardMaterial({ color: 0xf2bf3c, roughness: 0.3, metalness: 0.7 });
const COINS = [];
HOUSES.forEach((_, h) => { for (let k = 0; k < 3; k++) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(0.46, 0.46, 0.12, 28), coinMat); m.castShadow = true; scene.add(m);
  COINS.push({ h, t0: 11.0 + h * 0.28 + k * 0.13, dur: 0.95, m });
} });
const badge = (() => {
  const c = document.createElement("canvas"); c.width = 640; c.height = 200; const g = c.getContext("2d");
  rr(g, 10, 20, 620, 160, 80); g.fillStyle = "#82181A"; g.fill();
  g.fillStyle = "#FFA2A2"; g.font = `700 76px ${FONT}`; g.fillText("0%", 60, 128);
  g.fillStyle = "#fff"; g.font = `600 46px ${FONT}`; g.fillText("commission", 210, 120);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthTest: false, toneMapped: false }));
  s.renderOrder = 11; scene.add(s); return s;
})();

// scooters
function makeScooter() {
  const g = new THREE.Group(), body = new THREE.Group(); g.add(body);
  const add = (geo, m, x, y, z) => { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); o.castShadow = true; body.add(o); return o; };
  const wheel = new THREE.CylinderGeometry(0.26, 0.26, 0.14, 20);
  add(wheel, mat.ink, 0.62, 0.26, 0).rotation.x = Math.PI / 2;
  add(wheel, mat.ink, -0.62, 0.26, 0).rotation.x = Math.PI / 2;
  add(new RoundedBoxGeometry(1.3, 0.34, 0.5, 3, 0.12), M(0xe9ecee, 0.4), 0, 0.5, 0);
  add(new RoundedBoxGeometry(0.16, 0.9, 0.16, 2, 0.06), mat.green, 0.6, 0.9, 0);
  add(new RoundedBoxGeometry(0.1, 0.1, 0.7, 2, 0.04), mat.ink, 0.62, 1.34, 0);
  add(new RoundedBoxGeometry(0.42, 0.62, 0.42, 3, 0.14), mat.green, -0.05, 1.0, 0);          // rider
  add(new THREE.SphereGeometry(0.2, 18, 12), M(0xC4B4FF, 0.5), -0.02, 1.48, 0);                // helmet
  add(new RoundedBoxGeometry(0.62, 0.58, 0.62, 3, 0.1), mat.green, -0.62, 1.0, 0);             // delivery box (brand purple)
  add(new RoundedBoxGeometry(0.64, 0.08, 0.64, 2, 0.03), M(0xC4B4FF, 0.5), -0.62, 1.12, 0);
  g.scale.setScalar(1.15); scene.add(g); return g;
}
const RIDES = HOUSES.map(({ hx }, i) => {
  const d = [hx + 2.35, 17.7];
  const pts = [[11.2, 11.6], [11.2, LANE + (i - 1) * 0.35], [d[0], LANE + (i - 1) * 0.35], d];
  const seg = []; let L = 0;
  for (let k = 1; k < pts.length; k++) { const l = Math.hypot(pts[k][0] - pts[k - 1][0], pts[k][1] - pts[k - 1][1]); seg.push(l); L += l; }
  const parcel = rbox(hx + 1.75, 17.4, hx + 2.35, 18.0, 0, 0.5, mat.green, 0.08); scene.add(parcel);
  return { pts, seg, L, t0: 8.7 + i * 0.35, dur: 2.0, g: makeScooter(), parcel };
});
function along(r, u) {
  let d = u * r.L;
  for (let k = 0; k < r.seg.length; k++) {
    if (d <= r.seg[k] || k === r.seg.length - 1) {
      const a = r.pts[k], b = r.pts[k + 1], f = clamp(d / r.seg[k]);
      return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, Math.atan2(b[1] - a[1], b[0] - a[0])];
    }
    d -= r.seg[k];
  }
}

// ---------- timeline (a pure function of time) ----------
const LOOP = 15.6, DROP = 3.6;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const ease = (t) => { t = clamp(t); return 1 - Math.pow(1 - t, 3); };
const inOut = (t) => { t = clamp(t); return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const back = (t) => { t = clamp(t); const c = 1.5; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const W = Math.sqrt(150), Z = 0.5, WD = W * Math.sqrt(1 - Z * Z);
const springOff = (t) => Math.exp(-Z * W * t) * (Math.cos(WD * t) + (Z * W / WD) * Math.sin(WD * t));
const arc = (a, b, u, hgt) => [a[0] + (b[0] - a[0]) * u, a[1] + (b[1] - a[1]) * u, a[2] + (b[2] - a[2]) * u + Math.sin(Math.PI * u) * hgt];
const at = (x, y, z) => new THREE.Vector3(x, z, y);

const VIEW0 = 10.0, VIEW1 = 14.6, T0 = [6.5, 5.5, 4.4], T1 = [10.2, 11.8, 5.6], OFF = new THREE.Vector3(30, 24, 30);
let view = VIEW0;
const CAPS = [
  [0, "Step 1", "Set up your meat shop online in 3 minutes"],
  [4.0, "Step 2", "Launch your own TanyMeat ordering app"],
  [6.4, "Step 3", "Customers pick chicken, mutton or seafood"],
  [8.7, "Step 4", "Cut fresh to order. Delivered to their door."],
  [10.9, "Step 5", "0% marketplace commission. Every rupee is yours."],
];
const capStep = document.getElementById("capStep"), capLine = document.getElementById("capLine"), fadeEl = document.getElementById("fade");
let lastCap = -1, lastScreen = "";

function pose(t) {
  // camera: hold on the restaurant, then pull back over the neighbourhood
  const z = inOut((t - 3.7) / 1.5);
  view = VIEW0 + (VIEW1 - VIEW0) * z;
  const tgt = at(...T0.map((v, i) => v + (T1[i] - v) * z));
  cam.position.copy(tgt).add(OFF); cam.lookAt(tgt); resize();

  parts.forEach((p) => {
    const lt = t - p.t0, g = p.g;
    if (lt < 0) { g.visible = false; return; }
    g.visible = true;
    if (p.kind === "floor") {
      const a = ease(lt / 0.55), b = ease((lt - 0.18) / 0.6);
      g.scale.set(Math.max(0.001, a), 1, Math.max(0.04, b));
    } else if (p.kind === "wall") {
      g.scale.y = Math.max(0.001, ease(lt / 0.7));
    } else if (p.kind === "drop") {
      g.position.y = DROP * springOff(lt);
      g.scale.setScalar(Math.min(1, 0.55 + lt / 0.25));
    } else if (p.kind === "awning") {
      const ang = 90 - 68 * ease(lt / 0.8);
      awning.panel.rotation.x = THREE.MathUtils.degToRad(ang);
      awning.val.rotation.x = -THREE.MathUtils.degToRad(ang);
      g.scale.setScalar(Math.min(1, lt / 0.2));
    }
  });

  // phone rises out of its stand
  const pl = t - 5.0;
  phone.g.visible = pl >= 0;
  phone.inner.scale.y = Math.max(0.001, back(pl / 0.8));
  phone.g.children[1].scale.setScalar(Math.min(1, Math.max(0.001, pl / 0.25)));

  // orders fly from homes into the app
  let arrived = 0, pulse = 0;
  const scrC = [PX - 0.2, PY + 0.2, 5.4];
  ORDERS.forEach((o) => {
    const u = (t - o.t0) / o.dur, h = HOUSES[o.h];
    o.s.visible = u > 0 && u < 1;
    if (u >= 1) { arrived++; pulse = Math.max(pulse, 1 - clamp((t - o.t0 - o.dur) / 0.5)); }
    if (o.s.visible) {
      const p = arc([h.hx, (HY0 + HY1) / 2, 4.6], scrC, inOut(u), 3.2);
      o.s.position.copy(at(...p));
      const k = 1.7 * (u < 0.15 ? u / 0.15 : u > 0.85 ? Math.max(0.3, (1 - u) / 0.15) : 1);
      o.s.scale.set(k, k, 1);
    }
  });
  const key = 24 + arrived + ":" + pulse.toFixed(2) + fontReady() + imgsReady;
  if (key !== lastScreen) { lastScreen = key; drawScreen(24 + arrived, pulse); }

  // scooters ride out, parcels land at the door
  RIDES.forEach((r) => {
    const u = (t - r.t0) / r.dur;
    r.g.visible = t >= r.t0 - 0.25;
    const [x, y, hd] = along(r, inOut(u));
    r.g.position.copy(at(x, y, 0));
    r.g.rotation.y = -hd;
    r.g.scale.setScalar(1.15 * clamp((t - r.t0 + 0.25) / 0.25));
    const pu = t - (r.t0 + r.dur);
    r.parcel.visible = pu > 0;
    r.parcel.position.y = pu > 0 ? 1.4 * springOff(pu) : 0;
  });

  // payments come straight back to the restaurant's till
  const till = [9.9, 1.15, 3.0];
  COINS.forEach((c) => {
    const u = (t - c.t0) / c.dur, h = HOUSES[c.h];
    c.m.visible = u > 0 && u < 1;
    if (c.m.visible) {
      c.m.position.copy(at(...arc([h.hx + 2.2, 17.7, 1.2], till, inOut(u), 4.5)));
      c.m.rotation.set(Math.PI / 2, 0, u * 9);
    }
  });

  // expert labels
  LABELS.forEach((lb, i) => {
    const l = t - lb.t0, k = back(l / 0.5);
    lb.s.visible = l > 0;
    lb.s.position.copy(at(lb.p[0], lb.p[1], lb.p[2] + 0.08 * Math.sin(Math.max(0, l) * 2.2 + i)));
    lb.s.scale.set(lb.s.userData.w * k, lb.s.userData.w * 0.375 * k, 1);
  });

  // the badge over the restaurant
  const bl = t - 11.7;
  badge.visible = bl > 0;
  const bs = back(bl / 0.6);
  badge.position.copy(at(7.0, 5.0, 9.9 + 0.12 * Math.sin(Math.max(0, bl) * 2.4)));
  badge.scale.set(6.4 * bs, 2.0 * bs, 1);

  // captions and the loop's fade
  let ci = 0; CAPS.forEach((c, i) => { if (t >= c[0]) ci = i; });
  if (ci !== lastCap) { lastCap = ci; capLine.textContent = CAPS[ci][2]; }
  const since = t - CAPS[ci][0];
  capLine.style.opacity = String(clamp(since / 0.35));
  capLine.style.transform = `translateY(${(1 - ease(since / 0.45)) * 8}px)`;
  fadeEl.style.opacity = String(clamp((t - (LOOP - 0.5)) / 0.4));
}

// ---------- sizing, theme, loop ----------
let sz = '';
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  if (sz !== w + 'x' + h) { sz = w + 'x' + h; renderer.setSize(w, h, false); }
  const a = w / h || 1; cam.left = -view * a; cam.right = view * a; cam.top = view; cam.bottom = -view; cam.updateProjectionMatrix();
}
const isDark = () => root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
const syncTheme = () => { ground.material.opacity = isDark() ? 0.35 : 0.12; ground.material.color.set(isDark() ? 0x000000 : 0x3a2a55); };
new ResizeObserver(resize).observe(stage); resize(); syncTheme();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", syncTheme);

window.renderAt = (t) => { sign.draw(); pose(t); renderer.render(scene, cam); };
let start = performance.now();
const PLAYBACK_RATE = 0.8;
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
if (!q.get("video")) {
  const loop = (now) => { const t = reduced ? 13 : (((now - start) / 1000) * PLAYBACK_RATE) % LOOP; window.renderAt(t); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
window.LOOP = LOOP;
window.brandRefresh = () => { sign.reset(); sign.draw(); lastScreen = ""; brandDraws.forEach((d) => d()); };
document.fonts.load(`600 118px "Space Grotesk"`).then(() => window.brandRefresh()).catch(() => {});
document.fonts.ready.then(() => { lastScreen = ''; window.ready = true; });
</script>
