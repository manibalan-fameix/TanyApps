packages: []

allowBuilds:
  sharp: true
  unrs-resolver: true
  msw: false
  esbuild: false
  workerd: true
  '@firebase/util': false
  protobufjs: false

# Security overrides (pass 2). Each forces a patched release of the SAME major for a transitive dependency of build/dev tooling
# (shadcn CLI, OpenNext/wrangler, vitest, next's postcss). None of these packages is in the deployed Worker bundle.
# See docs/architecture/DEPENDENCY_ADVISORIES.md before removing or editing.
minimumReleaseAgeExclude:
  - hono@4.13.14

overrides:
  vite: ^8.3.5
  source-map-js: ^1.2.2
  "undici@7": ^7.30.1
  body-parser: ^2.4.0
  fast-uri: ^3.1.9
  hono: ^4.13.14
  ip-address: ^10.7.5
  "@modelcontextprotocol/sdk": ^1.32.0
  "@grpc/grpc-js": ^1.13.6
  "glob@10": ^10.5.0
